#
# Checks every push and pull request, both as the neutral build a clone gets and as the branded one
# that's deployed. Two jobs, Checks and Branded checks, are the checks a pull request has to pass;
# they run side by side. Once both pass, main is deployed (Deploy) or the pull request previewed
# (Preview), from the branded build Branded checks tested and saved, so what goes out is exactly what
# was tested.
#
# The branded build reads the private softdoglabs/brandkit repository with the BRANDKIT_TOKEN
# secret, a fine-grained token that can read that repository's contents and nothing else. Pull
# requests from forks don't get secrets, so for them (and until the token is added) Branded checks
# only says so. Deploying needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets.
#
# A pull request from this repository gets a preview of the branded app and docs: uploaded as
# Cloudflare versions under an alias made from its number and the PREVIEW_KEY secret
# (scripts/preview-alias.sh), so the addresses stay the same for the life of the pull request but
# can't be worked out from the number, and posted as a comment only when they change. The comment is
# as public as the pull request it's on.
#
# Never switch this to pull_request_target: that runs a fork's pull request with this repository's
# secrets, which would hand anyone the Cloudflare and brand kit tokens.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per branch at a time; a newer push to the same branch replaces an older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Versions come from package.json's packageManager and .node-version.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm docs:build

  branded:
    name: Branded checks
    runs-on: ubuntu-latest
    # What the jobs after this one may do. They can't read secrets in their own conditions.
    outputs:
      deploy: ${{ steps.secrets.outputs.deploy }}
      preview: ${{ steps.secrets.outputs.preview }}
      alias: ${{ steps.secrets.outputs.alias }}
    steps:
      # The preview alias needs the repository's own script, so it's checked out first.
      - uses: actions/checkout@v7

      # Secrets can't be read in an `if`, so this step says which ones there are. A deploy without
      # the kit fails here rather than going out neutral.
      - id: secrets
        env:
          BRANDKIT_TOKEN: ${{ secrets.BRANDKIT_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIEW_KEY: ${{ secrets.PREVIEW_KEY }}
          PR: ${{ github.event.pull_request.number }}
          DEPLOYING: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          PREVIEWING: ${{ github.event_name == 'pull_request' }}
        run: |
          deploy=false
          preview=false
          if [ "$DEPLOYING" = true ] && [ -n "$CLOUDFLARE_API_TOKEN" ]; then deploy=true; fi
          # Pull requests from forks get no secrets, so no kit and no token: no preview. Nor without
          # the key, rather than at an address anyone could work out from the number.
          if [ "$PREVIEWING" = true ] && [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$BRANDKIT_TOKEN" ]; then
            if [ -n "$PREVIEW_KEY" ]; then
              preview=true
              echo "alias=$(scripts/preview-alias.sh "$PR")" >> "$GITHUB_OUTPUT"
            else
              echo "::notice::No PREVIEW_KEY secret, so this pull request gets no preview."
            fi
          fi
          if [ -n "$BRANDKIT_TOKEN" ]; then
            echo "kit=true" >> "$GITHUB_OUTPUT"
          elif [ "$deploy" = true ]; then
            echo "::error::No BRANDKIT_TOKEN secret, so a deploy would be unbranded."
            exit 1
          else
            echo "::notice::No BRANDKIT_TOKEN secret here, so the branded build isn't checked."
          fi
          if [ "$deploy" = false ] && [ "$DEPLOYING" = true ]; then
            echo "::notice::No CLOUDFLARE_API_TOKEN secret yet, so nothing is deployed."
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "preview=$preview" >> "$GITHUB_OUTPUT"

      - name: Check out the brand kit
        if: steps.secrets.outputs.kit == 'true'
        uses: actions/checkout@v7
        with:
          repository: softdoglabs/brandkit
          path: .brandkit
          token: ${{ secrets.BRANDKIT_TOKEN }}
          persist-credentials: false

      - if: steps.secrets.outputs.kit == 'true'
        uses: pnpm/action-setup@v6
      - if: steps.secrets.outputs.kit == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - if: steps.secrets.outputs.kit == 'true'
        run: pnpm install --frozen-lockfile

      # Lint, types and formatting don't change with the kit; the tests and the builds do.
      - name: Test and build branded
        if: steps.secrets.outputs.kit == 'true'
        env:
          PACER_BRAND_DIR: .brandkit
        run: |
          pnpm test
          pnpm build
          pnpm docs:build

      # Handed to Deploy or Preview. It holds only what the live site serves anyway, and is kept a
      # day: long enough for the jobs after this one, or a re-run of them.
      - name: Save the branded build
        if: steps.secrets.outputs.deploy == 'true' || steps.secrets.outputs.preview == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: branded-build
          path: |
            dist
            build/docs-site
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy
    needs: [checks, branded]
    if: needs.branded.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      # wrangler and its configuration, from the repository; the files it serves, from the build.
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: branded-build

      - name: Deploy the app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

      - name: Deploy the docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy -c wrangler.docs.jsonc

  preview:
    name: Preview
    needs: [checks, branded]
    if: needs.branded.outputs.preview == 'true'
    runs-on: ubuntu-latest
    # Writing to pull requests is only for the preview comment.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: branded-build

      # Uploaded, not deployed: the live site doesn't change. Cloudflare prints each address only
      # once preview addresses are on for the Worker, which a deploy from main sets (wrangler*.jsonc).
      - name: Upload previews
        id: preview
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALIAS: ${{ needs.branded.outputs.alias }}
        run: |
          upload() {
            pnpm exec wrangler versions upload --preview-alias "$ALIAS" "$@" 2>&1 | tee /dev/stderr |
              sed -n 's/.*Version Preview Alias URL: \(https:[^ ]*\).*/\1/p' | tail -n 1
          }
          app=$(upload)
          docs=$(upload -c wrangler.docs.jsonc)
          if [ -z "$app" ] || [ -z "$docs" ]; then
            echo "::error::Cloudflare gave no preview address. Preview addresses are turned on by a deploy from main, and need the account's workers.dev subdomain."
            exit 1
          fi
          echo "app=$app/" >> "$GITHUB_OUTPUT"
          echo "docs=$docs/docs/pacer-programmer/" >> "$GITHUB_OUTPUT"

      # The addresses only change if the alias or the account's subdomain does, so most pushes post
      # nothing: a new comment only when the last one this job left says something else.
      - name: Comment the preview addresses
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          APP: ${{ steps.preview.outputs.app }}
          DOCS: ${{ steps.preview.outputs.docs }}
        run: |
          marker="<!-- pacer-programmer-preview -->"
          body="$marker
          Previews of this pull request, branded, updated on every push:

          - App: $APP
          - Docs: $DOCS"
          last=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .body | @base64" |
            tail -n 1 | base64 -d)
          if [ "$last" = "$body" ]; then
            echo "The pull request already has these addresses."
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
            echo "Commented the preview addresses."
          fi
